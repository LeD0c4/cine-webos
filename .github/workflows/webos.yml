# Construit l'appli LG webOS (.ipk) à chaque envoi et pull request, et la publie dans une « release »
# quand on pousse une étiquette v* (ex. git tag v1.7.0 && git push --tags).
#
# L'interface vient du dépôt cine-web (variable de dépôt CINE_WEB_REPO, sinon LeD0c4/cine-web).
name: webOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cine-webos

      - name: Interface (dépôt cine-web)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CINE_WEB_REPO || 'LeD0c4/cine-web' }}
          path: cine-web

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dépendances
        run: |
          npm ci --prefix cine-web
          npm ci --prefix cine-webos

      - name: Construire le paquet .ipk
        working-directory: cine-webos
        run: node build.mjs

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cine-webos/dist/*.ipk
